<!DOCTYPE html>
<html lang="{{ effective_language }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title data-i18n="portal.wifi.page_title">{{ tr("portal.wifi.page_title") }}</title>
    <style>
        :root {
            --bg: #0b1a0e;
            --card: #122418;
            --text: #e8f5e9;
            --muted: #8aa892;
            --accent: #3ddc84;
            --danger: #ff6b6b;
            --border: #1e3a28;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", system-ui, sans-serif;
            background: radial-gradient(1200px 600px at 50% -10%, #1a3d28, var(--bg));
            color: var(--text);
            padding: 1.25rem;
        }
        main {
            max-width: 420px;
            margin: 0 auto;
        }
        h1 {
            font-size: 1.45rem;
            font-weight: 650;
            margin: 0 0 .35rem;
            letter-spacing: -.02em;
        }
        .lead {
            color: var(--muted);
            font-size: .95rem;
            margin: 0 0 1.25rem;
            line-height: 1.45;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.1rem 1.15rem 1.25rem;
        }
        label {
            display: block;
            font-size: .8rem;
            color: var(--muted);
            margin: .85rem 0 .35rem;
        }
        select, input[type=password], input[type=text] {
            width: 100%;
            padding: .7rem .75rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #0d1f12;
            color: var(--text);
            font-size: 1rem;
        }
        .row {
            display: flex;
            gap: .5rem;
            align-items: stretch;
        }
        .row select { flex: 1; }
        button {
            appearance: none;
            border: 0;
            border-radius: 10px;
            padding: .75rem 1rem;
            font-size: .95rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-primary {
            width: 100%;
            margin-top: 1.1rem;
            background: var(--accent);
            color: #06210f;
        }
        .btn-primary:disabled {
            opacity: .55;
            cursor: wait;
        }
        .btn-secondary {
            width: 100%;
            margin-top: .7rem;
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-secondary:disabled {
            opacity: .55;
            cursor: wait;
        }
        .btn-secondary.hidden { display: none; }
        .btn-ghost {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
            padding: .65rem .8rem;
            white-space: nowrap;
        }
        .status {
            margin-top: .9rem;
            font-size: .9rem;
            min-height: 1.3em;
        }
        .status.err { color: var(--danger); }
        .status.ok { color: var(--accent); }
        .hint {
            margin-top: 1rem;
            font-size: .8rem;
            color: var(--muted);
            line-height: 1.4;
        }
    </style>
<script>
const I18N_MESSAGES = {{ i18n_messages | tojson }};
function i18nText(key) { return I18N_MESSAGES[key] || key; }
function i18nFormat(key, values) {
    return i18nText(key).replace(/\{([a-zA-Z_][a-zA-Z0-9_]*)\}/g,
        (match, name) => Object.prototype.hasOwnProperty.call(values, name) ? String(values[name]) : match);
}
</script>
</head>
<body>
<main>
    <h1 data-i18n="portal.wifi.title">{{ tr("portal.wifi.title") }}</h1>
    <p class="lead" data-i18n="portal.wifi.lead">{{ tr("portal.wifi.lead") }}</p>
    <div class="card">
        <label for="ssid-select" data-i18n="portal.wifi.network">{{ tr("portal.wifi.network") }}</label>
        <div class="row">
            <select id="ssid-select"></select>
            <button type="button" class="btn-ghost" id="btn-rescan" data-i18n="portal.wifi.scan">{{ tr("portal.wifi.scan") }}</button>
        </div>
        <label for="ssid-manual" data-i18n="portal.wifi.manual">{{ tr("portal.wifi.manual") }}</label>
        <input id="ssid-manual" type="text" autocomplete="off" placeholder="{{ tr('portal.wifi.manual_placeholder') }}" data-i18n-placeholder="portal.wifi.manual_placeholder">
        <label for="password" data-i18n="portal.wifi.password">{{ tr("portal.wifi.password") }}</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="{{ tr('portal.wifi.password_placeholder') }}" data-i18n-placeholder="portal.wifi.password_placeholder">
        <button type="button" class="btn-primary" id="btn-connect" data-i18n="portal.wifi.connect">{{ tr("portal.wifi.connect") }}</button>
        <button type="button" class="btn-secondary hidden" id="btn-try-saved" data-i18n="wifi.try_saved">{{ tr("wifi.try_saved") }}</button>
        <div class="status" id="status"></div>
        <p class="hint" data-i18n="portal.wifi.hint">{{ tr("portal.wifi.hint") }}</p>
    </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const statusEl = $("status");

function setStatus(msg, kind) {
    statusEl.textContent = msg || "";
    statusEl.className = "status" + (kind ? " " + kind : "");
}

async function refreshStatus() {
    try {
        const r = await fetch("/wifi/status.json");
        const data = await r.json();
        const btn = $("btn-try-saved");
        if (data.has_saved) btn.classList.remove("hidden");
        else btn.classList.add("hidden");
        if (data.client_connected) setStatus(i18nText("portal.wifi.leaving"), "ok");
    } catch (e) { /* ignore */ }
}

async function loadNetworks(rescan) {
    setStatus(rescan ? i18nText("portal.wifi.scanning") : i18nText("portal.wifi.loading"));
    try {
        const r = await fetch("/wifi/networks.json?rescan=" + (rescan ? "1" : "0"));
        const data = await r.json();
        const sel = $("ssid-select");
        sel.innerHTML = "";
        const networks = data.networks || [];
        if (!networks.length) {
            const opt = document.createElement("option");
            opt.value = "";
            opt.textContent = i18nText("portal.wifi.none_option");
            sel.appendChild(opt);
        } else {
            networks.forEach((n) => {
                const opt = document.createElement("option");
                opt.value = n.ssid;
                opt.textContent = `${n.ssid}  (${n.signal}%)`;
                sel.appendChild(opt);
            });
        }
        setStatus(networks.length ? i18nFormat(networks.length === 1 ? "portal.wifi.network_count.one" : "portal.wifi.network_count.other", { count: networks.length }) : i18nText("portal.wifi.no_networks"), "");
        refreshStatus();
    } catch (e) {
        setStatus(e.message || i18nText("portal.wifi.scan_failed"), "err");
    }
}

async function connect() {
    const ssid = ($("ssid-manual").value || $("ssid-select").value || "").trim();
    const password = $("password").value || "";
    if (!ssid) {
        setStatus(i18nText("portal.wifi.choose_network"), "err");
        return;
    }
    $("btn-connect").disabled = true;
    $("btn-try-saved").disabled = true;
    setStatus(i18nText("portal.wifi.connecting"));
    try {
        const r = await fetch("/wifi/connect", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ ssid, password }),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok || !data.ok) {
            throw new Error(data.message || i18nText("portal.wifi.connection_failed"));
        }
        setStatus(data.message || i18nText("portal.wifi.connected"), "ok");
    } catch (e) {
        setStatus(e.message || i18nText("portal.wifi.connection_failed"), "err");
    } finally {
        $("btn-connect").disabled = false;
        $("btn-try-saved").disabled = false;
    }
}

async function trySaved() {
    $("btn-connect").disabled = true;
    $("btn-try-saved").disabled = true;
    setStatus(i18nText("portal.wifi.trying_saved"));
    try {
        const r = await fetch("/wifi/try-saved", { method: "POST" });
        const data = await r.json().catch(() => ({}));
        if (!r.ok || !data.ok) {
            throw new Error(data.message || i18nText("portal.wifi.saved_unavailable"));
        }
        setStatus(data.message || i18nText("portal.wifi.connected"), "ok");
    } catch (e) {
        setStatus(e.message || i18nText("portal.wifi.saved_unavailable"), "err");
        loadNetworks(true);
    } finally {
        $("btn-connect").disabled = false;
        $("btn-try-saved").disabled = false;
        refreshStatus();
    }
}

$("btn-rescan").addEventListener("click", () => loadNetworks(true));
$("btn-connect").addEventListener("click", connect);
$("btn-try-saved").addEventListener("click", trySaved);
refreshStatus();
loadNetworks(true);
</script>
</body>
</html>

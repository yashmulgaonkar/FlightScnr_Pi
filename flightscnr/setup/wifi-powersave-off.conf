# NetworkManager default for new/unspecified Wi-Fi profiles.
# 2 = disable IEEE 802.11 power save. FlightScnr kiosks are wall-powered;
# PSM stalls phone hotspots and Bluetooth coexistence on brcmfmac.
[connection]
wifi.powersave=2
